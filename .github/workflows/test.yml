name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]
        rust: [stable]
        exclude:
          # Node 20 and 24 require newer C++ standards not supported by Neon 0.10.1 on Windows
          - os: windows-latest
            node-version: 20.x
          - os: windows-latest
            node-version: 24.x

    steps:
    - uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: "pnpm"

    - name: Setup Python (for node-gyp)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup MSBuild
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v2

    - name: Install node-gyp dependencies on Windows
      if: runner.os == 'Windows'
      run: |
        npm install --global node-gyp@latest
        node-gyp install --verbose
        node-gyp list
      shell: cmd
      env:
        npm_config_msvs_version: 2022

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v6
      with:
        path: native/target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      env:
        npm_config_msvs_version: 2022
        npm_config_build_from_source: true

    - name: Run Rust formatting check
      run: cd native && cargo fmt -- --check

    - name: Run Rust linter
      run: cd native && cargo clippy -- -D warnings

    - name: Run Rust tests
      run: cd native && cargo test

    - name: Build native module
      run: pnpm run build:dev

    - name: Run Node.js test
      run: node lib/index.js

    - name: Build release
      run: pnpm run build

  minimal-versions:
    name: Check minimal versions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust nightly
      uses: dtolnay/rust-toolchain@nightly

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: "pnpm"

    - name: Check minimal versions
      run: |
        cd native
        cargo +nightly -Z minimal-versions update
        cargo check